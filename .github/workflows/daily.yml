# 週一到週五台灣時間約 14:03、15:07，跑完整的技術分析並更新網頁。
#
# 完整分析只排在收盤後：股市 13:30 收盤，盤中日線資料的收盤價是空的，會被
# stock_checker.py 的 drop_unfinished_today() 濾掉、改用前一天收盤，重算均線/RSI/
# 訊號等於白跑。14:03 提早試著看資料是否已經齊全（沒齊全就安全地維持原狀），
# 15:07 是留了緩衝時間的正式版本，一定會有結果。
# 盤中的價格更新（給「我的持股」檢查移動停損用）是另一支 intraday-quotes.yml，
# 用分鐘線抓現價、不重算技術指標，跟這裡分開。
name: daily-update

on:
  schedule:
    # 刻意避開整點：GitHub 官方說明整點是排程最容易被延遲或跳過的時段，
    # 偏移幾分鐘可以大幅降低這個機率。
    - cron: "3 6 * * 1-5"   # 約 14:03（提早看看資料是否已齊全）
    - cron: "7 7 * * 1-5"   # 約 15:07（正式版本）
  workflow_dispatch:   # 也可以在 GitHub 網頁上手動按「Run workflow」

concurrency:
  group: pages   # 跟 intraday-quotes.yml 共用同一個群組，避免兩邊同時發布網頁互相蓋掉
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt   # 精簡版：不裝 matplotlib（畫圖只有本機用得到），跑快一點
      - run: python screener.py
        continue-on-error: true   # 選股失敗也要讓網頁照常更新（搜尋會顯示提示）
      - run: python build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
