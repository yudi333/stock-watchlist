# 週一到週五台灣時間約 15:07、16:10、18:00，跑完整的技術分析並更新網頁。
#
# 排程不是用 GitHub 自己的 schedule（官方說明常常會延遲或整個被跳過，實測也真的不準時），
# 改用外部的 cron-job.org 這個服務，時間到了直接呼叫這支 workflow 的
# workflow_dispatch API（repos/.../actions/workflows/daily.yml/dispatches）觸發，
# 準時很多。要改時間到 cron-job.org 網站上改那三個工作，這個檔案本身不用動。
#
# 完整分析只排在收盤後：股市 13:30 收盤，盤中日線資料的收盤價是空的，會被
# stock_checker.py 的 drop_unfinished_today() 濾掉、改用前一天收盤，重算均線/RSI/
# 訊號等於白跑。15:07 是留了緩衝時間的正式版本。16:10、18:00 是後續兩道保險：
# 遇到 Yahoo／證交所資料延遲比較久的日子（會在頁面上方看到橘色提醒），這幾次
# 通常就會補上；三次都失敗也不會出錯，只是網頁會維持上一次的內容，並標示哪些
# 股票資料延遲。
# 盤中的價格更新（給「我的持股」檢查移動停損用）是另一支 intraday-quotes.yml，
# 用分鐘線抓現價、不重算技術指標，跟這裡分開。
name: daily-update

on:
  workflow_dispatch:   # cron-job.org 定時呼叫這個；也可以自己到 GitHub 網頁上手動按「Run workflow」

concurrency:
  group: pages   # 跟 intraday-quotes.yml、night-futures.yml 共用同一個群組，避免兩邊同時發布網頁互相蓋掉
  # 原本是 false（捲到後面排隊，不會插隊）：結果某次 intraday-quotes 卡在 pending 一直沒結束
  # （疑似 GitHub 那邊的問題），把同一群組的 daily-update 整個堵住，一連好幾次排程都被取消、
  # 網頁好幾天沒更新。改成 true：新的排程一來，直接取消還卡著的舊執行，不要一直等——
  # 正常情況下三支 workflow 的排程時間本來就不重疊，不會因此誤殺真的在跑的工作。
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # 正常幾分鐘內會跑完，上限抓寬一點；真的卡住就讓它失敗，不要無限等
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt   # 精簡版：不裝 matplotlib（畫圖只有本機用得到），跑快一點
      - run: python screener.py
        continue-on-error: true   # 選股失敗也要讓網頁照常更新（搜尋會顯示提示）
      - run: python build_site.py
      - run: python notify.py make   # 產生 Telegram 通知的摘要文字（message.txt），給最後的 notify job 用
        if: always()
        continue-on-error: true      # 產生摘要失敗不該讓網頁發布跟著失敗
      - name: 算出今天的日期（台灣時間）
        id: sheet_date
        run: echo "date=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_OUTPUT"
      - name: 檢查今天是否已經回測過
        # 一天最多回測一次：理由跟下面 notify job 的「一天最多發一次」一樣，這個 job 一天會跑
        # 3 次。回測查的是以前記過的舊資料，重跑 3 次沒有額外好處，只是浪費 API 額度。
        # 記錄到 Google 試算表不套用這個限制，見下面那個步驟的說明。
        id: backtest_logged
        uses: actions/cache@v4
        with:
          path: .backtest-logged
          key: backtest-logged-${{ steps.sheet_date.outputs.date }}
      - run: pip install gspread google-auth   # 記錄／回測用到，daily-update 每次都需要
      - name: 記錄到 Google 試算表
        # 這個故意「每次都跑」，不是一天只記一次：同一天的 3 次分析結果可能不一樣（Yahoo
        # 資料中途修正），網站顯示的永遠是最後一次的結果，試算表也要跟著更新到最新，
        # 不然會卡在當天第一次、可能已經過時的資料（sync_rows_top 裡會把當天稍早記錄的
        # 那一批刪掉重寫，所以重複執行不會變成重複的列）。
        run: python sheets_log.py
        continue-on-error: true   # 沒設定或寫入失敗都不該讓網頁發布跟著失敗
        env:
          GOOGLE_SHEETS_KEY: ${{ secrets.GOOGLE_SHEETS_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
      - name: 回測（檢查以前記錄過的候選股後來有沒有觸發停損停利）
        if: steps.backtest_logged.outputs.cache-hit != 'true'
        run: python backtest.py && (mkdir -p .backtest-logged && date > .backtest-logged/done)
        continue-on-error: true   # 沒設定或回測失敗都不該讓網頁發布跟著失敗
        env:
          GOOGLE_SHEETS_KEY: ${{ secrets.GOOGLE_SHEETS_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
      - uses: actions/upload-artifact@v4   # 存成 artifact 讓 notify job（別的 runner）讀得到
        if: always()
        with:
          name: notify-message
          path: message.txt
          retention-days: 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [build, deploy]
    if: always()   # build 或 deploy 失敗也要通知，不然你只會看到網頁沒更新、不知道為什麼
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: 算出今天的日期（台灣時間）
        id: today
        run: echo "date=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_OUTPUT"
      # checkout 要放在「讀取今天稍早那則訊息的 id」之前：actions/checkout 預設會先執行
      # git clean，把工作目錄裡所有沒被 git 追蹤的檔案都清掉，.tg-message-id 這種快取恢復
      # 出來的資料夾正是這種「未追蹤」檔案——順序顛倒的話，快取才剛恢復就被 checkout 清掉，
      # 讀 id 永遠讀到空的，變成每次都誤判成「今天還沒發過」，每次都發新訊息而不是編輯舊的
      # （這個 bug 第一次改成「每次都跑」時踩到過，這裡是修正後的正確順序）。
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - uses: actions/download-artifact@v4
        continue-on-error: true   # build 太早失敗、根本沒產生 message.txt 也沒關係
        with:
          name: notify-message
      - name: 讀取今天稍早那則訊息的 id（如果有的話）
        # 不是「一天只發一次」，是「一天只留一則、內容一直更新成最新一次的結果」：
        # 15:07/16:10/18:00 這三次都會執行到下面，但不是每次都發新訊息——第一次（cache
        # miss）發新的，把 Telegram 回傳的 message_id 存進 .tg-message-id、存進 cache；
        # 同一天後面的執行（cache hit）讀出這個 id，改成「編輯」那則舊訊息，內容換成這次
        # 的結果，Telegram 上看到的永遠只有一則、但顯示最新一次跑的內容，跟網站/試算表
        # 現在都是「顯示最後一次結果」的邏輯一致。
        id: msg_cache
        uses: actions/cache@v4
        with:
          path: .tg-message-id
          key: notified-${{ steps.today.outputs.date }}
      - name: 讀取快取裡的訊息 id
        id: read_id
        run: echo "id=$(cat .tg-message-id/id 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - name: 傳送或更新今天的 Telegram 通知
        run: |
          mkdir -p .tg-message-id
          python notify.py send "${{ needs.build.result }}" "${{ needs.deploy.result }}"
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_EDIT_ID: ${{ steps.read_id.outputs.id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
