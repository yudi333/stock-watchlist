# 週一到週五台灣時間約 21:00，跑完整的技術分析並更新網頁。
#
# 排程不是用 GitHub 自己的 schedule（官方說明常常會延遲或整個被跳過，實測也真的不準時），
# 改用外部的 cron-job.org 這個服務，時間到了直接呼叫這支 workflow 的
# workflow_dispatch API（repos/.../actions/workflows/daily.yml/dispatches）觸發，
# 準時很多。要改時間到 cron-job.org 網站上改那個工作，這個檔案本身不用動。
#
# 完整分析排在收盤後很久才跑：股市 13:30 收盤，盤中日線資料的收盤價是空的，會被
# stock_checker.py 的 drop_unfinished_today() 濾掉、改用前一天收盤，重算均線/RSI/
# 訊號等於白跑；21:00 留了近 7.5 小時的緩衝，讓資料來源有足夠時間定案。以前是
# 一天跑 3 次當「資料還沒穩定」的保險，但 Yahoo 的資料有時候不是單純缺漏、而是
# 收盤後幾小時內數字還會變，跑 3 次反而可能分析出不同結果；改成一次執行，
# 搭配 screener.py 的 apply_official_ohlcv()（官方資料為主、Yahoo 為輔）取代
# 「多跑幾次」這個做法，資料來源都失敗也不會出錯，只是網頁會維持上一次的內容，
# 並標示哪些股票資料延遲。
# 盤中的價格更新（給「我的持股」檢查移動停損用）是另一支 intraday-quotes.yml，
# 用分鐘線抓現價、不重算技術指標，跟這裡分開。
name: daily-update

on:
  workflow_dispatch:   # cron-job.org 定時呼叫這個；也可以自己到 GitHub 網頁上手動按「Run workflow」
    inputs:
      force_backtest:
        description: >-
          即使今天已經回測過也強制再跑一次回測（每天 21:00 真正的排程要帶這個，見下面
          「回測」那個步驟的說明；不帶就維持原本「今天已經跑過就跳過」的行為，手動用
          Telegram「重新跑」補跑時用這個，省 API 額度）
        type: boolean
        default: false

concurrency:
  group: pages   # 跟 intraday-quotes.yml、night-futures.yml 共用同一個群組，避免兩邊同時發布網頁互相蓋掉
  # 原本是 false（捲到後面排隊，不會插隊）：結果某次 intraday-quotes 卡在 pending 一直沒結束
  # （疑似 GitHub 那邊的問題），把同一群組的 daily-update 整個堵住，一連好幾次排程都被取消、
  # 網頁好幾天沒更新。改成 true：新的排程一來，直接取消還卡著的舊執行，不要一直等——
  # 正常情況下三支 workflow 的排程時間本來就不重疊，不會因此誤殺真的在跑的工作。
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # 正常幾分鐘內會跑完，上限抓寬一點；真的卡住就讓它失敗，不要無限等
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt   # 精簡版：不裝 matplotlib（畫圖只有本機用得到），跑快一點
      - run: python screener.py
        continue-on-error: true   # 選股失敗也要讓網頁照常更新（搜尋會顯示提示）
      - run: python build_site.py
      - run: python notify.py make   # 產生 Telegram 通知的摘要文字（message.txt），給最後的 notify job 用
        if: always()
        continue-on-error: true      # 產生摘要失敗不該讓網頁發布跟著失敗
      - name: 先抓回目前已發布的停損/停利通知內容（這次如果沒有新事件，維持原本的，不被清空）
        run: curl -fsSL "https://yudi333.github.io/stock-watchlist/stop_message.txt?t=$(date +%s)" -o stop_message.txt || echo "網站上還沒有，略過"
      - name: 算出今天的日期（台灣時間）
        id: sheet_date
        run: echo "date=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_OUTPUT"
      - name: 檢查今天是否已經回測過
        # 一天最多回測一次：萬一手動重跑好幾次（排程本身一天只跑一次），回測查的是以前
        # 記過的舊資料，當天重跑沒有額外好處，只是浪費 API 額度。記錄到 Google 試算表
        # 不套用這個限制，見下面那個步驟的說明。真正每天 21:00 的那次排程會帶
        # force_backtest=true，不管今天有沒有跑過都要真的跑一次——這個快取只影響「今天
        # 已經用 Telegram『重新跑』補跑過」這種情況要不要再跳過，不影響正式排程。
        id: backtest_logged
        uses: actions/cache@v4
        with:
          path: .backtest-logged
          key: backtest-logged-${{ steps.sheet_date.outputs.date }}
      - run: pip install gspread==6.2.1 google-auth==2.50.0   # 記錄／回測用到，daily-update 每次都需要
      - name: 記錄到 Google 試算表
        # 這個故意「每次都跑」，不是一天只記一次：同一天的 3 次分析結果可能不一樣（Yahoo
        # 資料中途修正），網站顯示的永遠是最後一次的結果，試算表也要跟著更新到最新，
        # 不然會卡在當天第一次、可能已經過時的資料（sync_rows_top 裡會把當天稍早記錄的
        # 那一批刪掉重寫，所以重複執行不會變成重複的列）。
        run: python sheets_log.py
        continue-on-error: true   # 沒設定或寫入失敗都不該讓網頁發布跟著失敗
        env:
          GOOGLE_SHEETS_KEY: ${{ secrets.GOOGLE_SHEETS_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
      - name: 回測（檢查以前記錄過的候選股後來有沒有觸發停損停利）
        # 今天沒跑過（cache miss）就跑；或是帶了 force_backtest=true（真正 21:00 的排程），
        # 不管今天跑過沒有都要真的跑一次，不能被前面手動補跑的快取擋掉。
        if: steps.backtest_logged.outputs.cache-hit != 'true' || inputs.force_backtest
        run: python backtest.py && (mkdir -p .backtest-logged && date > .backtest-logged/done)
        continue-on-error: true   # 沒設定或回測失敗都不該讓網頁發布跟著失敗
        env:
          GOOGLE_SHEETS_KEY: ${{ secrets.GOOGLE_SHEETS_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID_STOP: ${{ secrets.TG_CHAT_ID_STOP }}   # 已停損/已停利另外發到這個群組，沒設定就略過
      - uses: actions/upload-artifact@v4   # 存成 artifact 讓 notify job（別的 runner）讀得到
        if: always()
        with:
          name: notify-message
          path: message.txt
          retention-days: 1
      - name: 把摘要／停損停利通知／訊號勝率統計也放進要部署的網頁
        # 這三個都是用「複製進 site/」的方式補發布，不是 build_site.py 自己產生的：
        # message.txt／stop_message.txt 給「訊息重發」指令用；signal_stats.json 是回測
        # 算出來的訊號歷史勝率（信心程度用），回測排在 build_site.py 之後才跑，來不及讓
        # build_site.py 自己複製，不然原本只能等「下一次」daily-update 開始時才間接補上，
        # 平常一天只跑一次的話，變成要晚一整天「信心程度」才會真的用上最新的勝率。
        if: always()
        run: |
          [ -f message.txt ] && cp message.txt site/message.txt || echo "沒有 message.txt，略過"
          [ -f stop_message.txt ] && cp stop_message.txt site/stop_message.txt || echo "沒有 stop_message.txt，維持原本的版本"
          [ -f signal_stats.json ] && cp signal_stats.json site/signal_stats.json || echo "沒有 signal_stats.json，維持原本的版本"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [build, deploy]
    if: always()   # build 或 deploy 失敗也要通知，不然你只會看到網頁沒更新、不知道為什麼
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.5
      - uses: actions/download-artifact@v4
        continue-on-error: true   # build 太早失敗、根本沒產生 message.txt 也沒關係
        with:
          name: notify-message
      - name: 傳送今天的 Telegram 通知
        # 每次執行都發一則新訊息，不編輯舊的——同一天不管跑幾次（排程、或手動補跑）都各自
        # 發一則，不會悄悄把前面的訊息內容換掉、讓人誤以為沒反應（之前編輯舊訊息的做法
        # 容易讓人找不到更新在哪，改成每次都是新訊息，代價是同一天重跑幾次就會收到幾則）。
        run: python notify.py send "${{ needs.build.result }}" "${{ needs.deploy.result }}"
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
