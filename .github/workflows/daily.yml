# 週一到週六台灣時間 15:00（UTC 07:00）自動分析並更新網頁
name: daily-update

on:
  schedule:
    - cron: "0 7 * * 1-6"   # 週一到週六（週六會用整週資料更新週線候選）
  workflow_dispatch:   # 也可以在 GitHub 網頁上手動按「Run workflow」

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 安裝中文字型（圖上的中文才不會變方塊）
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python stock_checker.py
      - run: python screener.py
        continue-on-error: true   # 選股失敗也要讓網頁照常更新
      - run: python build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
