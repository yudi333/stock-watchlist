# 週一到週五台灣時間約 14:03、15:07 自動分析並更新網頁
#
# 為什麼不做盤中更新：股市 13:30 收盤，盤中 Yahoo 回傳的當天資料收盤價是空的，
# 會被 stock_checker.py 的 drop_unfinished_today() 濾掉、改用前一天收盤，等於白跑。
# 所以兩次都排在收盤後：14:03 提早試著看資料是否已經齊全（沒齊全就安全地維持原狀，
# 不會出錯或顯示錯誤資訊），15:07 是留了緩衝時間的正式版本，一定會有結果。
name: daily-update

on:
  schedule:
    # 刻意避開整點：GitHub 官方說明整點是排程最容易被延遲或跳過的時段，
    # 偏移幾分鐘可以大幅降低這個機率。
    - cron: "3 6 * * 1-5"   # 約 14:03（提早看看資料是否已齊全）
    - cron: "7 7 * * 1-5"   # 約 15:07（正式版本）
  workflow_dispatch:   # 也可以在 GitHub 網頁上手動按「Run workflow」

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python screener.py
        continue-on-error: true   # 選股失敗也要讓網頁照常更新（搜尋會顯示提示）
      - run: python build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
