# 週一到週五台灣時間約 15:07、16:10、18:00，跑完整的技術分析並更新網頁。
#
# 排程不是用 GitHub 自己的 schedule（官方說明常常會延遲或整個被跳過，實測也真的不準時），
# 改用外部的 cron-job.org 這個服務，時間到了直接呼叫這支 workflow 的
# workflow_dispatch API（repos/.../actions/workflows/daily.yml/dispatches）觸發，
# 準時很多。要改時間到 cron-job.org 網站上改那三個工作，這個檔案本身不用動。
#
# 完整分析只排在收盤後：股市 13:30 收盤，盤中日線資料的收盤價是空的，會被
# stock_checker.py 的 drop_unfinished_today() 濾掉、改用前一天收盤，重算均線/RSI/
# 訊號等於白跑。15:07 是留了緩衝時間的正式版本。16:10、18:00 是後續兩道保險：
# 遇到 Yahoo／證交所資料延遲比較久的日子（會在頁面上方看到橘色提醒），這幾次
# 通常就會補上；三次都失敗也不會出錯，只是網頁會維持上一次的內容，並標示哪些
# 股票資料延遲。
# 盤中的價格更新（給「我的持股」檢查移動停損用）是另一支 intraday-quotes.yml，
# 用分鐘線抓現價、不重算技術指標，跟這裡分開。
name: daily-update

on:
  workflow_dispatch:   # cron-job.org 定時呼叫這個；也可以自己到 GitHub 網頁上手動按「Run workflow」

concurrency:
  group: pages   # 跟 intraday-quotes.yml 共用同一個群組，避免兩邊同時發布網頁互相蓋掉
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt   # 精簡版：不裝 matplotlib（畫圖只有本機用得到），跑快一點
      - run: python screener.py
        continue-on-error: true   # 選股失敗也要讓網頁照常更新（搜尋會顯示提示）
      - run: python build_site.py
      - run: python notify.py make   # 產生 Telegram 通知的摘要文字（message.txt），給最後的 notify job 用
        if: always()
        continue-on-error: true      # 產生摘要失敗不該讓網頁發布跟著失敗
      - name: 算出今天的日期（台灣時間）
        id: sheet_date
        run: echo "date=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_OUTPUT"
      - name: 檢查今天是否已經記錄到 Google 試算表
        # 一天最多記一次，理由跟下面 notify job 的「一天最多發一次」一樣：這個 job 一天會跑
        # 3 次，只有第一次真的把當天的多重訊號／候選股寫進試算表，其餘兩次跳過，不會重複累積。
        id: sheet_logged
        uses: actions/cache@v4
        with:
          path: .sheet-logged
          key: sheet-logged-${{ steps.sheet_date.outputs.date }}
      - name: 檢查今天是否已經回測過
        # 跟上面記錄用的是不同的快取標記，故意分開：回測失敗不該連累記錄（不然重跑會插入
        # 重複的當天資料），記錄失敗也不該連累回測（回測本來就是查以前記過的舊資料，跟今天
        # 有沒有記錄成功是兩回事）。這個步驟要放在下面「安裝套件」之前，不然它的
        # cache-hit 結果還沒產生，下面引用就會拿到空值。
        id: backtest_logged
        uses: actions/cache@v4
        with:
          path: .backtest-logged
          key: backtest-logged-${{ steps.sheet_date.outputs.date }}
      - run: pip install gspread google-auth   # 只有平常用不到，需要時才裝，維持其他步驟的安裝速度
        if: steps.sheet_logged.outputs.cache-hit != 'true' || steps.backtest_logged.outputs.cache-hit != 'true'
      - name: 記錄到 Google 試算表
        # 標記要等 sheets_log.py 真的成功（回傳 0）才寫，順序很重要：先寫標記再執行的話，
        # 失敗了也會被當成「今天記過了」，之後同一天不會再重試，之前就是這樣才卡住的。
        if: steps.sheet_logged.outputs.cache-hit != 'true'
        run: python sheets_log.py && (mkdir -p .sheet-logged && date > .sheet-logged/done)
        continue-on-error: true   # 沒設定或寫入失敗都不該讓網頁發布跟著失敗
        env:
          GOOGLE_SHEETS_KEY: ${{ secrets.GOOGLE_SHEETS_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
      - name: 回測（檢查以前記錄過的候選股後來有沒有觸發停損停利）
        if: steps.backtest_logged.outputs.cache-hit != 'true'
        run: python backtest.py && (mkdir -p .backtest-logged && date > .backtest-logged/done)
        continue-on-error: true   # 沒設定或回測失敗都不該讓網頁發布跟著失敗
        env:
          GOOGLE_SHEETS_KEY: ${{ secrets.GOOGLE_SHEETS_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
      - uses: actions/upload-artifact@v4   # 存成 artifact 讓 notify job（別的 runner）讀得到
        if: always()
        with:
          name: notify-message
          path: message.txt
          retention-days: 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [build, deploy]
    if: always()   # build 或 deploy 失敗也要通知，不然你只會看到網頁沒更新、不知道為什麼
    runs-on: ubuntu-latest
    steps:
      - name: 算出今天的日期（台灣時間）
        id: today
        run: echo "date=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_OUTPUT"
      - name: 檢查今天是否已經通知過
        # 一天最多發一次：15:07/16:10/18:00 這三次收盤後的更新，只有當天第一次成功執行到
        # 這裡的會真的發送，其餘兩次會跳過（但 build/deploy 一樣照跑、網頁一樣照常更新，
        # 只是不會再發 Telegram）。做法：用當天日期當 cache key，第一次是 cache miss，
        # 送出通知後把 .notified 存進 cache；之後同一天的執行會 cache hit 直接跳過。
        id: notified
        uses: actions/cache@v4
        with:
          path: .notified
          key: notified-${{ steps.today.outputs.date }}
      - uses: actions/checkout@v4
        if: steps.notified.outputs.cache-hit != 'true'
      - uses: actions/setup-python@v5
        if: steps.notified.outputs.cache-hit != 'true'
        with:
          python-version: "3.11"
      - run: pip install requests
        if: steps.notified.outputs.cache-hit != 'true'
      - uses: actions/download-artifact@v4
        if: steps.notified.outputs.cache-hit != 'true'
        continue-on-error: true   # build 太早失敗、根本沒產生 message.txt 也沒關係
        with:
          name: notify-message
      - name: 傳送 Telegram 通知
        if: steps.notified.outputs.cache-hit != 'true'
        run: |
          mkdir -p .notified && date > .notified/sent
          python notify.py send "${{ needs.build.result }}" "${{ needs.deploy.result }}"
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
