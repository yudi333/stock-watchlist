# 週一到週五台灣時間約 14:03、15:07、16:33，跑完整的技術分析並更新網頁。
#
# 完整分析只排在收盤後：股市 13:30 收盤，盤中日線資料的收盤價是空的，會被
# stock_checker.py 的 drop_unfinished_today() 濾掉、改用前一天收盤，重算均線/RSI/
# 訊號等於白跑。14:03 提早試著看資料是否已經齊全（沒齊全就安全地維持原狀），
# 15:07 是留了緩衝時間的正式版本。16:33 是第三道保險：遇到 Yahoo／證交所資料
# 延遲比較久的日子（會在頁面上方看到橘色提醒），這次通常就會補上；三次都失敗
# 也不會出錯，只是網頁會維持上一次的內容，並標示哪些股票資料延遲。
# 盤中的價格更新（給「我的持股」檢查移動停損用）是另一支 intraday-quotes.yml，
# 用分鐘線抓現價、不重算技術指標，跟這裡分開。
name: daily-update

on:
  schedule:
    # 刻意避開整點：GitHub 官方說明整點是排程最容易被延遲或跳過的時段，
    # 偏移幾分鐘可以大幅降低這個機率。
    - cron: "3 6 * * 1-5"    # 約 14:03（提早看看資料是否已齊全）
    - cron: "7 7 * * 1-5"    # 約 15:07（正式版本）
    - cron: "33 8 * * 1-5"   # 約 16:33（第三道保險，補資料延遲的日子）
  workflow_dispatch:   # 也可以在 GitHub 網頁上手動按「Run workflow」

concurrency:
  group: pages   # 跟 intraday-quotes.yml 共用同一個群組，避免兩邊同時發布網頁互相蓋掉
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt   # 精簡版：不裝 matplotlib（畫圖只有本機用得到），跑快一點
      - run: python screener.py
        continue-on-error: true   # 選股失敗也要讓網頁照常更新（搜尋會顯示提示）
      - run: python build_site.py
      - run: python notify.py make   # 產生 Telegram 通知的摘要文字（message.txt），給最後的 notify job 用
        if: always()
        continue-on-error: true      # 產生摘要失敗不該讓網頁發布跟著失敗
      - uses: actions/upload-artifact@v4   # 存成 artifact 讓 notify job（別的 runner）讀得到
        if: always()
        with:
          name: notify-message
          path: message.txt
          retention-days: 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [build, deploy]
    if: always()   # build 或 deploy 失敗也要通知，不然你只會看到網頁沒更新、不知道為什麼
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - uses: actions/download-artifact@v4
        continue-on-error: true   # build 太早失敗、根本沒產生 message.txt 也沒關係
        with:
          name: notify-message
      - name: 傳送 Telegram 通知
        run: python notify.py send "${{ needs.build.result }}" "${{ needs.deploy.result }}"
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
