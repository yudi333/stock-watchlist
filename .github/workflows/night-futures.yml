# 每天早上（台灣時間約 08:03）單獨更新一次台指期夜盤，其他部分不動。
#
# 為什麼要獨立這支：夜盤（盤後交易）15:00 到隔天 05:00 才收盤，daily.yml 完整分析排在 21:00
# 跑的時候，當晚的夜盤才剛開盤沒多久、還在跑，抓到的是還沒結束的盤中價格；改成隔天早上
# 8 點（留了緩衝時間）單獨抓一次，這時候夜盤已經收盤，才是「跑完整晚」的最終結果。
#
# 排程不是用 GitHub 自己的 schedule（原因跟 daily.yml 一樣：常常延遲或整個被跳過），
# 改用外部的 cron-job.org 定時呼叫 workflow_dispatch 觸發，crontab 是 `3 8 * * 1-5`
# （台灣時區）。這裡只留 workflow_dispatch，要改執行時間到 cron-job.org 網站上改，
# 不用動這個檔案。
#
# 做法：把目前已發布的網頁檔案抓下來（避免蓋掉），只更新 market.json 的 night 欄位，再重新發布。
# 網頁會在載入時額外讀一次 market.json（見 template.html 的 loadMarket()），所以這裡更新的夜盤
# 就算晚於 daily.yml 那幾次產生網頁的時間，使用者還是看得到最新的。
name: night-futures

on:
  workflow_dispatch:   # cron-job.org 定時呼叫這個；也可以自己到 GitHub 網頁上手動按「Run workflow」

concurrency:
  group: pages   # 跟 daily.yml、intraday-quotes.yml 共用同一個群組，避免同時發布互相蓋掉
  cancel-in-progress: true   # 新的排程來了就直接取消還卡著的舊執行，不要一直排隊等（見 daily.yml 的說明）

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # 正常幾十秒內會跑完，上限抓寬一點；真的卡住就讓它失敗，不要無限等
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install requests   # 最輕量安裝，不需要 pandas/yfinance
      - name: 取回目前已發布的網頁檔案（避免這次發布把它們蓋掉）
        run: |
          mkdir -p site
          for f in index.html history.json candidates_daily.csv candidates_weekly.csv market.json universe.json quotes.json terms.html privacy.html; do
            curl -fsSL "https://yudi333.github.io/stock-watchlist/$f?t=$(date +%s)" -o "site/$f" \
              || echo "略過 $f（可能還沒發布過，正常現象）"
          done
      - run: python night_futures.py site/market.json
        continue-on-error: true   # 抓不到夜盤也要保留剛剛取回的舊網頁內容，不能讓網頁消失
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
